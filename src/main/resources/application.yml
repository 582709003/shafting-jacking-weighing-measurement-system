spring:
  application:
    name: shafting-jacking-weighing-system
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/shafting_weighing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:582709}
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 720m

app:
  bootstrap:
    admin-password: ${ADMIN_INITIAL_PASSWORD:Admin@123}
  plc:
    mode: ${DEVICE_MODE:SIMULATOR}
    host: ${PLC_HOST:}
    rack: ${PLC_RACK:}
    slot: ${PLC_SLOT:}
    connect-timeout-ms: ${PLC_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PLC_READ_TIMEOUT_MS:3000}
    write-timeout-ms: ${PLC_WRITE_TIMEOUT_MS:3000}
    feedback-timeout-ms: ${PLC_FEEDBACK_TIMEOUT_MS:3000}
    poll-interval-ms: ${PLC_POLL_INTERVAL_MS:200}
    pulse-ms: ${PLC_PULSE_MS:200}
    feedback-selected-channel: ${PLC_FEEDBACK_SELECTED_CHANNEL:}
    feedback-mode: ${PLC_FEEDBACK_MODE:}
    feedback-action: ${PLC_FEEDBACK_ACTION:}
    feedback-run-state: ${PLC_FEEDBACK_RUN_STATE:}
    feedback-process-stage: ${PLC_FEEDBACK_PROCESS_STAGE:}
    feedback-sample-sequence: ${PLC_FEEDBACK_SAMPLE_SEQUENCE:}
    feedback-fault-code: ${PLC_FEEDBACK_FAULT_CODE:}
    zero-displacement:
      TAIL_SHAFT: ${PLC_ZERO_TAIL_SHAFT:}
      INTERMEDIATE_1: ${PLC_ZERO_INTERMEDIATE_1:}
      INTERMEDIATE_2: ${PLC_ZERO_INTERMEDIATE_2:}
      FLYWHEEL: ${PLC_ZERO_FLYWHEEL:}
      MAIN_ENGINE_1: ${PLC_ZERO_MAIN_ENGINE_1:}
      MAIN_ENGINE_2: ${PLC_ZERO_MAIN_ENGINE_2:}
    manual-target:
      TAIL_SHAFT: ${PLC_MANUAL_TARGET_TAIL_SHAFT:}
      INTERMEDIATE_1: ${PLC_MANUAL_TARGET_INTERMEDIATE_1:}
      INTERMEDIATE_2: ${PLC_MANUAL_TARGET_INTERMEDIATE_2:}
      FLYWHEEL: ${PLC_MANUAL_TARGET_FLYWHEEL:}
      MAIN_ENGINE_1: ${PLC_MANUAL_TARGET_MAIN_ENGINE_1:}
      MAIN_ENGINE_2: ${PLC_MANUAL_TARGET_MAIN_ENGINE_2:}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    manual-enabled: ${MANUAL_SIMULATOR_ENABLED:true}
    interval-ms: ${SIMULATOR_INTERVAL_MS:500}
    precheck-ms: ${SIMULATOR_PRECHECK_MS:1000}
    lifting-ms: ${SIMULATOR_LIFTING_MS:8000}
    lowering-ms: ${SIMULATOR_LOWERING_MS:8000}
    fallback-force-kn: ${SIMULATOR_FALLBACK_FORCE_KN:180.0}
    manual-motor-rpm: ${MANUAL_SIMULATOR_MOTOR_RPM:800}
